name: AOIA-Core CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile source trees
        run: python3 -m compileall runtime tests scripts

      - name: Run unit tests
        run: PYTHONPATH=runtime:. python3 -m unittest discover -s tests -p "test*.py" -v
