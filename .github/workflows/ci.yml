name: AOIA-Core CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Isolate Python bytecode
        run: echo "PYTHONPYCACHEPREFIX=${RUNNER_TEMP}/aoia-core-pycache" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile source trees
        run: python3 -m compileall runtime tests scripts

      - name: Install build backend
        run: python3 -m pip install --upgrade pip setuptools wheel

      - name: Install editable package
        run: python3 -m pip install --no-build-isolation -e . --no-deps

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p "test*.py" -v
