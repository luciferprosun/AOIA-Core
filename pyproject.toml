[project]
name = "aoia-core"
version = "0.0.0"
description = "local-first pre-execution inspection and audit framework for AI-assisted commands"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "runtime"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["runtime"]
include = [
    "adaptive_routing*",
    "commands*",
    "knowledge*",
    "memory*",
    "memory_hats*",
    "orchestrator*",
    "provider_critic*",
    "providers*",
    "retrieval*",
    "router*",
    "safety*",
    "schemas*",
    "tools*",
]
namespaces = true
